name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and run every test
        run: bash build.sh        # javac -Xlint:all, then all tests; needs only a JDK, git and bash
        timeout-minutes: 25
